    <script defer>
	(function() {
		var vm = DOM_VUE.createApp({
			el: "#root",
			data: {"sidebar_enabled":true,"sidebar_active":false,"sidebar_only_search":true,"preload":{"os":"DSM","content":"<h1 class=\"kb_accordion_h1\"><a id=\"x_anchor_idc32babe627\"><\/a>How can I back up my Synology NAS?<span><\/span><\/h1>\n<div class=\"kb_accordion_container\">\n\n  <div class=\"kb_accordion has_accordion\">\n    <h2 class=\"kb_accordion_title\"><a id=\"x_anchor_id3ec365dd53\"><\/a>Details<\/h2>\n    <div class=\"kb_accordion_content\">\n      <div>\n        <p><img src=\"..\/..\/..\/_images\/autogen\/How_to_back_up_your_Synology_NAS\/1.png\" style=\"width: 640px;\" class=\"img_border\" alt=\"1.png\" \/><\/p>\n        <p>To protect your data on Synology NAS in case of an IT disaster, we suggest that you follow the 3-2-1 backup strategy (3 copies; 2 storage mediums; 1 offsite). This article will introduce several tools that can help to build your own 3-2-1 data protection solution, including:\n          <ul>\n            <li>Hyper Backup<\/li>\n            <li>Snapshot Replication<\/li>\n            <li>Active Backup for Business<\/li>\n            <li>USB Copy<\/li>\n            <li>Cloud Sync<\/li>\n          <\/ul>\n\n        <\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"kb_accordion has_accordion\">\n    <h2 class=\"kb_accordion_title\"><a id=\"x_anchor_id0ba29c6a1a\"><\/a>Environment<\/h2>\n    <div class=\"kb_accordion_content\">\n      <div>\n        <p>DSM 6.1 or above<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"kb_accordion has_accordion\">\n    <h2 class=\"kb_accordion_title\"><a id=\"x_anchor_idb5a4b64b2a\"><\/a>Resolution<\/h2>\n    <div class=\"kb_accordion_content\">\n      <div>\n        <h3><a id=\"x_anchor_idd25317655c\"><\/a>Back up to the same Synology NAS<\/h3>\n        <p class=\"margin_bottom_1\">Having a multi-version local copy gives you the advantage of fast recovery in the event of data corruption or accidental file deletion, since the data copy can be retrieved directly from your Synology NAS. However, even when such measure is taken, RAID crash and hard drive failure might still cause data loss. Thus, we highly recommend you to create a multi-version local copy to ensure restore efficiency while also backing up to a different destination for further data protection.<\/p>\n        <p class=\"margin_bottom_1\"><strong>Hyper Backup<\/strong> allows you to back up applications and system configurations and restore them when needed. Hyper Backup also features <strong>block-level incremental backup<\/strong>, meaning that only files that have been changed will be backed up, while files that are simply renamed or duplicated will be deleted via cross-file deduplication to avoid unnecessary storage consumption.<\/p>\n        <p class=\"margin_bottom_1\">If your NAS model supports the Btrfs<a href=\"#x_anchor_idb056396663\"><sup>1<\/sup><\/a> file system, you can also consider creating a local copy using <strong>Snapshot Replication<\/strong>. The snapshot process is quick and has a minimal impact on system performance. Compared to Hyper Backup, Snapshot Replication is faster in terms of backup speed\/recovery time, and it is also applicable to shared folders and iSCSI LUN.<\/p>\n        <p>To learn how to create backup tasks, refer to <a href=\"https:\/\/kb.synology.com\/en-global\/DSM\/tutorial\/How_to_back_up_your_data_to_local_shared_folders_or_USB_with_Hyper_Backup\" target=\"_blank\" rel=\"noopener noreferrer nofollow\">this article<\/a> for <strong>Hyper Backup<\/strong> and <a href=\"https:\/\/www.synology.com\/en-global\/knowledgebase\/DSM\/help\/SnapshotReplication\/snapshots\" target=\"_blank\" rel=\"noopener noreferrer nofollow\">this article<\/a> for <strong>Snapshot Replication<\/strong>.<\/p>\n        <h3><a id=\"x_anchor_id0072b6471c\"><\/a>Back up to a different destination<\/h3>\n        <li class=\"note_item\"><a id=\"x_anchor_id677fe58cab\"><\/a><strong>To external devices (USB)<\/strong><\/li>\n        <p class=\"margin_bottom_1\"><strong>Hyper Backup<\/strong> allows you to back up applications and system configurations to external devices, and restore them when needed, while also featuring the <strong>block-level incremental backup<\/strong> and <strong>cross-file deduplication<\/strong> features mentioned previously.<\/p>\n        <p class=\"margin_bottom_1\">On the other hand, <strong>USB Copy<\/strong> does not support the backup of applications or system configurations, and its lack of the <strong>cross-file deduplication<\/strong> feature might lower storage efficiency. However, this package can start backing up data as soon as an external device is plugged in, and ejects the device upon completion of the backup process. Additionally, the format of data backed up via <strong>USB copy<\/strong> is readable, while the <strong>Hyper Backup<\/strong> counterpart is not.<\/p>\n        <p class=\"margin_bottom_1\">To learn how to back up data to external devices, refer to <a href=\"https:\/\/kb.synology.com\/en-global\/DSM\/tutorial\/How_to_back_up_your_data_to_local_shared_folders_or_USB_with_Hyper_Backup\" target=\"_blank\" rel=\"noopener noreferrer nofollow\">this article<\/a> for <strong>Hyper Backup<\/strong> and <a href=\"https:\/\/www.synology.com\/en-global\/knowledgebase\/DSM\/help\/USBCopy\/usbcopy_general\" target=\"_blank\" rel=\"noopener noreferrer nofollow\">this article<\/a> for <strong>USB Copy<\/strong>.<\/p>\n        <li class=\"note_item\"><a id=\"x_anchor_id47252b2e5e\"><\/a><strong>To another Synology NAS<\/strong><\/li>\n        <p class=\"margin_bottom_1\">When backed up to another Synology NAS, data is transferred via the protocol of your Synology NAS.<\/p>\n        <p class=\"margin_bottom_1\">With <strong>Hyper Backup<\/strong>, you can easily back up data to a remote NAS device by installing <strong>Hyper Backup Vault<\/strong> on the destination, a package that allows you to view the backup tasks you received and task-related logs on the receiving device. Hyper Backup supports both the EXT4 and the Btrfs file system, but the format of the backup data is not readable. <a href=\"https:\/\/kb.synology.com\/en-global\/DSM\/tutorial\/How_to_back_up_your_data_to_a_remote_Synology_NAS_or_file_server_with_Hyper_Backup\" target=\"_blank\">Learn more<\/a><\/p>\n        <p class=\"margin_bottom_1\"><strong>Snapshot Replication<\/strong> provides the convenience of replicating snapshots to multiple remote Synology NAS and only replicates altered data blocks to reduce bandwidth and time consumption. For management flexibility, one replication can be extended to up to three remote sites. Snapshot Replication is only applicable to models that support the Btrfs<a href=\"#x_anchor_idb056396663\"><sup>1<\/sup><\/a> file system. <a href=\"https:\/\/www.synology.com\/en-global\/knowledgebase\/DSM\/help\/SnapshotReplication\/replication\" target=\"_blank\">Learn more<\/a><\/p>\n        <p class=\"margin_bottom_1\">If you want to protect your entire system, <strong>Active Backup for Business<\/strong> provides bare-metal backup for your Synology NAS. It backs up the entire operating system, applications, settings, and data to a remote NAS. This package utilizes global deduplication to highly optimize storage efficiency and allows you to manage all backup tasks from a centralized console. <a href=\"https:\/\/kb.synology.com\/en-global\/DSM\/help\/ActiveBackup\/activebackup_business_nas_dsm\" target=\"_blank\">Learn more<\/a><\/p>\n\n\n        <li class=\"note_item\"><a id=\"x_anchor_id18336f1aff\"><\/a><strong>To file servers<\/strong><\/li>\n        <p class=\"margin_bottom_1\">This backup approach supports the rsync, HTTP, WebDAV, OpenStack, as well as S3 protocols and consumes more storage on the client side for cache than for volume used when backing up to another Synology NAS.<\/p>\n        <p class=\"margin_bottom_1\"><strong>Hyper Backup<\/strong> allows you to back up data to file servers via the rsync and HTTP (WebDAV and OpenStack) protocols. Its multi-version support helps step up the protection of your data, and <strong>cross-version deduplication<\/strong> reduces the amount of space in your volume required to store multiple versions. The support for applications and system configurations backup also enables you to restore to your original settings.<\/p>\n        <p class=\"margin_bottom_1\">Refer to <a href=\"https:\/\/kb.synology.com\/en-global\/DSM\/tutorial\/How_to_back_up_your_data_to_a_remote_Synology_NAS_or_file_server_with_Hyper_Backup\" target=\"_blank\" rel=\"noopener noreferrer nofollow\">this article<\/a> to learn how to back up data to file servers using <strong>Hyper Backup<\/strong>.<\/p>\n        <li class=\"note_item\"><a id=\"x_anchor_id76a4c064f1\"><\/a><strong>To cloud services<\/strong><\/li>\n        <p class=\"margin_bottom_1\"><strong>Hyper Backup<\/strong> allows you to back up data to Synology's cloud service <a href=\"https:\/\/c2.synology.com\/\" target=\"_blank\" rel=\"noopener noreferrer nofollow\">Synology C2 Storage<\/a>, as well as other public cloud services.<\/p>\n        <p class=\"margin_bottom_1\"><strong>Cloud Sync<\/strong> can also be employed as a real-time solution to sync Synology NAS data to public clouds if the <strong>one-way upload<\/strong> feature is enabled. However, this package only retains the current version of all files on your Synology NAS. If the cloud service you use supports versioning, you can still create multi-version backup tasks. Also, files synchronized to the destination remain the same format as that of the source.<\/p>\n        <p>To learn how to back up data to cloud services, refer to <a href=\"https:\/\/kb.synology.com\/en-global\/DSM\/tutorial\/How_to_back_up_your_data_to_cloud_services_with_Hyper_Backup\" target=\"_blank\" rel=\"noopener noreferrer nofollow\">this article<\/a> for <strong>Hyper Backup<\/strong> and <a href=\"https:\/\/www.synology.com\/en-global\/knowledgebase\/DSM\/help\/CloudSync\/cloudsync\" target=\"_blank\" rel=\"noopener noreferrer nofollow\">this article<\/a> for <strong>Cloud Sync<\/strong>.<\/p>\n        <h3><a id=\"x_anchor_ide0b4e126b6\"><\/a>Compare backup solutions<\/h3>\n        <p>After understanding the 3-2-1 strategy and having at least two data copies, you can rest assured that your data is readily available and well protected.<\/p>\n        <p>The table below provides a summary of all of the backup tools introduced in this article and a comparison of their features. Refer to the table to find out which package is the most suitable for your needs.<\/p>\n        <table cellspacing=\"0\" cellpadding=\"0\">\n          <tbody>\n            <tr>\n              <th>Backup Destination<\/th>\n              <th>Hyper Backup<\/th>\n              <th>Snapshot Replication<a href=\"#x_anchor_idb056396663\"><sup>1<\/sup><\/a><\/th>\n              <th>Active Backup for Business<\/th>\n              <th>USB Copy<\/th>\n              <th>Cloud Sync<\/th>\n            <\/tr>\n            <tr>\n              <td>Local Shared Folders<\/td>\n              <td>Yes<\/td>\n              <td>Yes<\/td>\n              <td>No<\/td>\n              <td>No<\/td>\n              <td>No<\/td>\n            <\/tr>\n            <tr>\n              <td>External Devices (USB)<\/td>\n              <td>Yes<\/td>\n              <td>No<\/td>\n              <td>No<\/td>\n              <td>Yes<\/td>\n              <td>No<\/td>\n            <\/tr>\n            <tr>\n              <td>Another Synology NAS<\/td>\n              <td>Yes<\/td>\n              <td>Yes<\/td>\n              <td>Yes<\/td>\n              <td>No<\/td>\n              <td>No<\/td>\n            <\/tr>\n            <tr>\n              <td>File Servers<\/td>\n              <td>Yes<\/td>\n              <td>No<\/td>\n              <td>No<\/td>\n              <td>No<\/td>\n              <td>Only WebDAV and OpenStack data synchronization<\/td>\n            <\/tr>\n            <tr>\n              <td>Public Clouds<\/td>\n              <td>Yes<\/td>\n              <td>No<\/td>\n              <td>No<\/td>\n              <td>No<\/td>\n              <td>Yes<\/td>\n            <\/tr>\n            <tr>\n              <td colspan=\"6\">\n                <p><strong>Features Summary<\/strong><\/p><\/td>\n            <\/tr>\n            <tr>\n              <td>Bare-Metal Backup<\/td>\n              <td>Yes<\/td>\n              <td>No<\/td>\n              <td>Yes<\/td>\n              <td>No<\/td>\n              <td>No<\/td>\n            <\/tr>\n            <tr>\n              <td>Applications<a href=\"#x_anchor_id23709fbb6e\"><sup>2<\/sup><\/a> & System Configurations Backup<\/td>\n              <td>Yes<\/td>\n              <td>No<\/td>\n              <td>Yes<\/td>\n              <td>No<\/td>\n              <td>No<\/td>\n            <\/tr>\n            <tr>\n              <td>Backup & Restore Performance<\/td>\n              <td>Low<\/td>\n              <td>High<\/td>\n              <td>Low<\/td>\n              <td>Medium<\/td>\n              <td>Medium<\/td>\n            <\/tr>\n            <tr>\n              <td>Storage Efficiency<\/td>\n              <td>Medium<\/td>\n              <td>High<\/td>\n              <td>High<\/td>\n              <td>Low<\/td>\n              <td>Low<\/td>\n            <\/tr>\n            <tr>\n              <td>Backup Frequency<\/td>\n              <td>Hourly<\/td>\n              <td>5 mins (shared folder)<br \/>15 mins (iSCSI LUN)<\/td>\n              <td>Hourly<\/td>\n              <td>Hotplug support<\/td>\n              <td>Sync when changed are made<\/td>\n            <\/tr>\n            <tr>\n              <td>Protect Backup Data with WriteOnce<\/td>\n              <td>No<\/td>\n              <td>Only immutable snapshots<a href=\"#x_anchor_idf00edc94cc\"><sup>3<\/sup><\/a><\/td>\n              <td>No<\/td>\n              <td>No<\/td>\n              <td>No<\/td>\n            <\/tr>\n          <\/tbody>\n        <\/table>\n        <p><\/p>\n        <div class=\"note\">\n          <p class=\"note_title\">Notes:<\/p>\n          <ol class=\"type_lower-decimal\">\n            <li class=\"note_item\"><a id=\"x_anchor_idb056396663\"><\/a><strong>Snapshot Replication<\/strong> only supports the Btrfs file system, while the EXT4 file system is not supported. Refer to <a href=\"https:\/\/www.synology.com\/en-global\/dsm\/packages\/SnapshotReplication\" target=\"_blank\" rel=\"noopener noreferrer nofollow\">the list of compatible models<\/a>.<\/li>\n            <li class=\"note_item\"><a id=\"x_anchor_id23709fbb6e\"><\/a>Only a select list of applications are supported for backup. You can refer to the application page of the backup wizard for more details.<\/li>\n            <li class=\"note_item\"><a id=\"x_anchor_idf00edc94cc\"><\/a>Learn more about <a href=\"https:\/\/kb.synology.com\/en-global\/DSM\/tutorial\/what_is_an_immutable_snapshot\" target=\"_blank\" rel=\"noopener noreferrer nofollow\">immutable snapshots and how to create them<\/a>.<\/li>\n          <\/ol>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div><link rel=\"stylesheet\" href=\"\/css\/feedback_form\/feedback_form_web.css\" \/>\n\n<div class=\"feedBackForm feedBackForm--noiframe clearfix en-global\" style=\"opacity: 0;\">\n    <div class=\"clearfix\">\n        <!-- Begin page content -->\n        <div id=\"main\" class=\"DSM\">\n            <div class=\"feedback_form\">\n                <form id=\"feedback_form\" class=\"feedback_form_class\" action=\"https:\/\/kb.synology.com\/en-global\/feedback\" method=\"POST\">\n                    <div id=\"form_option\" class=\"form_option_class\" style=\"display:none;\" >\n                        <!-- option when selected no -->\n\n                        <div class=\"button_no\">\n                            <div class=\"center\" style=\"text-align:left;margin-top:3px;\">\n                                <p class=\"button_no_title\">Please tell us why the article wasn't helpful:<\/p>\n\n
